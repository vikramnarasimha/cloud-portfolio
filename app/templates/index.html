<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Chords | Engineering Journal</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { font-size: 1.5rem; color: #38bdf8; margin: 0 0 10px 0; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; }
        .entry {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .date { color: #94a3b8; }
        h2 { font-size: 1.2rem; margin: 0 0 10px 0; color: #f8fafc; }
        p { margin: 0; color: #cbd5e1; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <h1>~/code-and-chords</h1>
        <div class="subtitle">Terminal-driven engineering journal & architectural log.</div>
    </header>
    <main>
        {% for entry in entries %}
        <div class="entry">
            <div class="meta">
                <span>[{{ entry.category }}]</span>
                <span class="date">{{ entry.date }}</span>
            </div>
            <h2>{{ entry.title }}</h2>
            <div>{{ entry.content | safe }}</div>
        </div>
        {% endfor %}
    </main>
</body>
</html>
